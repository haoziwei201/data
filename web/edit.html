<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>编辑问卷</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="topbar">
  <span class="brand"><a href="/my.html" style="color:inherit;text-decoration:none;">← 返回</a></span>
  <span class="who" id="status-badge"></span>
</div>
<div class="container">
  <div id="err" class="error-box"></div>

  <div class="card">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
      <span style="font-size:15px;">状态：</span>
      <span id="st-badge" class="badge gray"></span>
      <span style="margin-left:auto;display:flex;gap:8px;">
        <button id="btn-publish" style="display:none;" onclick="doPublish()">发布问卷</button>
        <button id="btn-pause" class="ghost" style="display:none;" onclick="doPause()">暂停收集</button>
        <button id="btn-resume" style="display:none;" onclick="doResume()">继续收集</button>
      </span>
    </div>
    <div id="locked-tip" class="ok-box"></div>
    <div class="share-line" id="share-line" style="display:none;margin-top:8px;"></div>
  </div>

  <div class="card">
    <h2>基本信息</h2>
    <label class="field">问卷标题 <input type="text" id="m-title" maxlength="100"></label>
    <label class="field">问卷说明 <textarea id="m-desc" rows="2"></textarea></label>
    <label class="field">截止时间 <input type="datetime-local" id="m-deadline"></label>
    <label class="inline"><input type="checkbox" id="m-anon"> 允许匿名填写</label>
    <label class="inline"><input type="checkbox" id="m-multi"> 允许同一人多次填写</label>
    <div style="margin-top:8px;"><button class="ghost" onclick="saveMeta()">保存基本信息</button></div>
  </div>

  <div class="card">
    <h2>题目（按顺序填写，可配置跳转）</h2>
    <div id="qlist"></div>
    <button id="btn-add-q" onclick="startAdd()">＋ 添加题目</button>
    <button id="btn-add-bank" class="ghost" onclick="toggleBankPicker()">⊕ 从题库选题</button>
  </div>

  <div class="card" id="bank-picker" style="display:none;">
    <h2>从题库选题（可复用 / 共享的题目）</h2>
    <div class="muted" style="margin-bottom:10px;">选择「我的题库」或「共享给我的」题目加入本问卷；加入的是内容快照，之后题库更新不会影响本卷，可随时在题目上「升级」。</div>
    <table class="list">
      <thead><tr><th>题目</th><th>题型</th><th>版本</th><th>来源</th><th>操作</th></tr></thead>
      <tbody id="bank-tbody"></tbody>
    </table>
  </div>

  <div class="card" id="import-card">
    <h2>导入题目模板</h2>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <select id="import-src" style="flex:1;min-width:260px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:14px;"></select>
      <button onclick="doImport()">导入到本问卷</button>
    </div>
    <div class="muted" style="margin-top:8px;">题目将追加到当前问卷末尾；跳转规则的目标会自动指向新导入的题目。</div>
  </div>

  <div class="card" id="qeditor" style="display:none;">
    <h2 id="editor-title">添加题目</h2>
    <label class="field">题型
      <select id="q-type">
        <option value="single_choice">单选题</option>
        <option value="multi_choice">多选题</option>
        <option value="text">文本填空</option>
        <option value="number">数字填空</option>
      </select>
    </label>
    <label class="field">题目标题 <input type="text" id="q-title" maxlength="500" placeholder="例如：你的性别"></label>
    <label class="inline"><input type="checkbox" id="q-required"> 必答题</label>

    <div id="q-options-box">
      <h3>选项</h3>
      <div id="q-options"></div>
      <button class="ghost small" onclick="addOptRow()">＋ 添加选项</button>
    </div>

    <div id="q-config-box"></div>

    <div id="q-jumps-box">
      <h3>跳转规则（按顺序匹配，命中第一条即跳转；都不命中则进入下一题）</h3>
      <div id="q-jumps"></div>
      <button class="ghost small" onclick="addJumpRow()">＋ 添加跳转规则</button>
    </div>

    <div style="margin-top:16px;">
      <button onclick="saveQuestion()">保存题目</button>
      <button class="ghost" onclick="cancelEdit()">取消</button>
    </div>
  </div>
</div>
<script src="/common.js"></script>
<script>
if (!localStorage.getItem("token")) location = "/";
const surveyId = new URLSearchParams(location.search).get("survey");
let survey = null, questions = [], editingId = null;
let optRows = [];   // 编辑器中的选项行 {key, text}
let jumpRows = [];  // 编辑器中的跳转规则 {match:{...}, goto}
let keySeq = 1;

const STATUS = { draft: ["草稿", "gray"], published: ["收集中", "green"],
                 paused: ["已暂停", "amber"], closed: ["已关闭", "red"] };
const STATUS_TIPS = {
  draft: ["当前为草稿：可自由编辑题目，点击「发布问卷」开始收集答卷。", "ok"],
  published: ["收集中：题目不可修改。如需修改题目或导入模板，请先「暂停收集」。", "warn"],
  paused: ["已暂停：问卷暂时不可填写，题目可修改、可导入模板；完成后点击「继续收集」重新开放。", "ok"],
  closed: ["问卷已关闭：停止收集，题目不可修改。", "warn"],
};

const CONFIG_HTML = {
  single_choice: "",
  multi_choice: `
    <h3>选择数量限制（不填则不限制）</h3>
    <label class="inline">最少选择 <input type="number" id="c-minSelect" min="1" style="width:80px;"></label>
    <label class="inline">最多选择 <input type="number" id="c-maxSelect" min="1" style="width:80px;"></label>`,
  text: `
    <h3>字数限制（不填则不限制）</h3>
    <label class="inline">最少字数 <input type="number" id="c-minLength" min="0" style="width:80px;"></label>
    <label class="inline">最多字数 <input type="number" id="c-maxLength" min="0" style="width:80px;"></label>`,
  number: `
    <h3>数值限制（不填则不限制）</h3>
    <label class="inline">最小值 <input type="number" id="c-min" step="any" style="width:90px;"></label>
    <label class="inline">最大值 <input type="number" id="c-max" step="any" style="width:90px;"></label>
    <label class="inline"><input type="checkbox" id="c-integer"> 必须是整数</label>`,
};

async function loadAll() {
  try {
    const data = await api(`/api/surveys/${surveyId}`);
    survey = data.survey;
    questions = data.questions.filter(q => !q.deleted);
    renderStatus(); renderMeta(); renderList(); loadImportSources();
  } catch (e) {
    if (e.status === 401) { localStorage.setItem("next", location.href); location = "/"; }
    else showMsg("err", e.message);
  }
}

function isEditable() { return survey && (survey.status === "draft" || survey.status === "paused"); }

function renderStatus() {
  const [label, cls] = STATUS[survey.status] || [survey.status, "gray"];
  document.getElementById("status-badge").innerHTML =
    `${esc(survey.title)} <span class="badge ${cls}">${label}</span>`;
  document.getElementById("st-badge").textContent = label;
  document.getElementById("st-badge").className = "badge " + cls;

  document.getElementById("btn-publish").style.display = survey.status === "draft" ? "" : "none";
  document.getElementById("btn-pause").style.display = survey.status === "published" ? "" : "none";
  document.getElementById("btn-resume").style.display = survey.status === "paused" ? "" : "none";

  const [tip, kind] = (STATUS_TIPS[survey.status] || ["", "ok"]);
  const tipEl = document.getElementById("locked-tip");
  tipEl.textContent = tip;
  tipEl.className = kind === "warn" ? "warn-box" : "ok-box";
  tipEl.style.display = tip ? "block" : "none";

  const editable = isEditable();
  document.getElementById("btn-add-q").style.display = editable ? "" : "none";
  document.getElementById("btn-add-bank").style.display = editable ? "" : "none";
  document.getElementById("import-card").style.display = editable ? "block" : "none";
  renderShare();
}

function renderShare() {
  const line = document.getElementById("share-line");
  if (survey.status !== "draft" && survey.slug) {
    const url = location.origin + "/survey/" + survey.slug;
    line.style.display = "flex";
    line.innerHTML = `填写链接：<code>${esc(url)}</code>
      <button class="small ghost" onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(url)}');prompt('填写链接：','${esc(url)}')">复制</button>`;
  } else {
    line.style.display = "none";
  }
}

async function doPublish() {
  if (!confirm("发布后填写者即可通过链接填写；如需修改题目可随时「暂停收集」。确定发布？")) return;
  try {
    const r = await api(`/api/surveys/${surveyId}/publish`, { method: "POST" });
    showMsg("err", "发布成功！填写链接：" + location.origin + r.shareUrl, true);
    loadAll();
  } catch (e) { showMsg("err", e.message); }
}

async function doPause() {
  if (!confirm("暂停后问卷暂时无法填写，题目可编辑；之后可随时「继续收集」。确定暂停？")) return;
  try {
    await api(`/api/surveys/${surveyId}/pause`, { method: "POST" });
    loadAll();
  } catch (e) { showMsg("err", e.message); }
}

async function doResume() {
  try {
    await api(`/api/surveys/${surveyId}/resume`, { method: "POST" });
    showMsg("err", "已重新开放填写。", true);
    loadAll();
  } catch (e) { showMsg("err", e.message); }
}

async function loadImportSources() {
  const sel = document.getElementById("import-src");
  sel.innerHTML = `<option value="demo">内置测试模板（4 题：单选跳转 + 数字 + 多选 + 文本）</option>`;
  try {
    const data = await api("/api/my/surveys");
    const others = data.surveys.filter(s => s.id !== surveyId);
    if (others.length) {
      const g = document.createElement("optgroup");
      g.label = "从我的问卷导入";
      for (const s of others) {
        const [label] = STATUS[s.status] || [s.status];
        g.innerHTML += `<option value="${s.id}">${esc(s.title)}（${label}，${s.responseCount} 份答卷）</option>`;
      }
      sel.appendChild(g);
    }
  } catch (e) { /* 列表加载失败不影响编辑 */ }
}

async function doImport() {
  const v = document.getElementById("import-src").value;
  if (!confirm("导入的题目将追加到当前问卷末尾，确定继续？")) return;
  try {
    const body = v === "demo" ? {} : { sourceSurveyId: v };
    const r = await api(`/api/surveys/${surveyId}/questions/import`, { method: "POST", body });
    showMsg("err", `已成功导入 ${r.imported} 道题。`, true);
    loadAll();
  } catch (e) { showMsg("err", e.message); }
}

function renderMeta() {
  document.getElementById("m-title").value = survey.title;
  document.getElementById("m-desc").value = survey.description || "";
  document.getElementById("m-deadline").value = survey.deadline ? String(survey.deadline).slice(0, 16) : "";
  document.getElementById("m-anon").checked = !!survey.allowAnonymous;
  document.getElementById("m-multi").checked = !!survey.allowMultipleSubmissions;
}

async function saveMeta() {
  try {
    await api(`/api/surveys/${surveyId}`, {
      method: "PATCH",
      body: {
        title: document.getElementById("m-title").value,
        description: document.getElementById("m-desc").value,
        deadline: document.getElementById("m-deadline").value || null,
        allowAnonymous: document.getElementById("m-anon").checked,
        allowMultipleSubmissions: document.getElementById("m-multi").checked,
      },
    });
    showMsg("err", "基本信息已保存", true);
    loadAll();
  } catch (e) { showMsg("err", e.message); }
}

function renderList() {
  const box = document.getElementById("qlist");
  box.innerHTML = "";
  if (!questions.length) {
    box.innerHTML = '<div class="muted" style="margin-bottom:10px;">还没有题目：可在下方手动添加，或使用「导入题目模板」快速创建一套测试题。</div>';
    return;
  }
  const locked = !isEditable();
  questions.forEach((q, i) => {
    const div = document.createElement("div");
    div.className = "qcard";
    let meta = `<div class="qmeta">${TYPE_LABELS[q.type]}${q.required ? " · 必答" : ""}`;
    if (q.type === "multi_choice") {
      const c = q.config || {};
      const parts = [];
      if (c.minSelect) parts.push("至少" + c.minSelect + "项");
      if (c.maxSelect) parts.push("最多" + c.maxSelect + "项");
      if (parts.length) meta += " · " + parts.join("，");
    }
    meta += "</div>";
    let body = "";
    if (q.options) body = q.options.map(o => `<div class="muted">• ${esc(o.text)} <span style="opacity:.5">(${esc(o.key)})</span></div>`).join("");
    else {
      const c = q.config || {};
      const parts = [];
      if (q.type === "text") {
        if (c.minLength != null) parts.push("最少" + c.minLength + "字");
        if (c.maxLength != null) parts.push("最多" + c.maxLength + "字");
      } else if (q.type === "number") {
        if (c.min != null) parts.push("≥" + c.min);
        if (c.max != null) parts.push("≤" + c.max);
        if (c.integer) parts.push("整数");
      }
      body = parts.length ? `<div class="muted">${parts.join("，")}</div>` : "";
    }
    const jumps = (q.jumpRules || []).map(j => `<div class="muted">↳ ${esc(describeJump(j, q))}</div>`).join("");
    const ops = locked ? "" : `
      <span class="ops">
        <button class="small ghost" ${i === 0 ? "disabled" : ""} onclick="move(${i},-1)">上移</button>
        <button class="small ghost" ${i === questions.length - 1 ? "disabled" : ""} onclick="move(${i},1)">下移</button>
        <button class="small ghost" onclick="startEdit('${q.id}')">编辑</button>
        <button class="small danger" onclick="delQuestion('${q.id}')">删除</button>
      </span>`;
    const bankOps = q.rootId
      ? `<span class="ops">
          <button class="small ghost" onclick="location='/question.html?id=${q.rootId}'">题库详情</button>
          <select id="ver-${q.id}" style="padding:2px 4px;border:1px solid var(--border);border-radius:4px;font-size:12px;">
            ${Array.from({length: q.bankTotalVersions || q.bankVersion || 1}, (_, i) => i + 1)
              .map(v => `<option value="${v}" ${v === q.bankVersion ? "selected" : ""}>v${v}</option>`).join("")}
          </select>
          <button class="small ghost" onclick="upgradeQ('${q.id}', '${esc(q.title)}')">切换版本</button>
        </span>
        <span class="muted">题库 v${q.bankVersion}/${q.bankCurrentVersion || q.bankVersion}</span>`
      : `<span class="ops"><button class="small ghost" onclick="saveBankQ('${q.id}', '${esc(q.title)}')">存入题库</button></span>
         <span class="muted">未入库</span>`;
    div.innerHTML = `
      <div class="qhead">
        <span class="muted">第${q.order}题</span>
        <span class="qtitle">${esc(q.title)}</span>
        ${ops}
      </div>
      <div class="qmeta">${bankOps}</div>
      ${meta}${body}${jumps}`;
    box.appendChild(div);
  });
}

function describeJump(j, q) {
  const m = j.match || {};
  const target = j.goto === "end" ? "结束问卷"
    : "第" + (questions.find(x => x.id === j.goto)?.order || "?") + "题";
  if (m.kind === "option_any") return `选中任一选项 [${(m.optionKeys || []).map(k => optText(q, k)).join("/")}] → ${target}`;
  if (m.kind === "option_all") return `同时选中 [${(m.optionKeys || []).map(k => optText(q, k)).join("/")}] → ${target}`;
  if (m.kind === "number") {
    if (m.op === "between") return `数字在 ${m.min ?? "-∞"}~${m.max ?? "+∞"} → ${target}`;
    const opLabel = { eq: "=", ne: "≠", gt: ">", gte: "≥", lt: "<", lte: "≤" }[m.op] || m.op;
    return `数字 ${opLabel} ${m.value} → ${target}`;
  }
  return `无条件 → ${target}`;
}
function optText(q, key) { return (q.options || []).find(o => o.key === key)?.text || key; }

async function move(i, d) {
  const ids = questions.map(q => q.id);
  [ids[i], ids[i + d]] = [ids[i + d], ids[i]];
  try { await api(`/api/surveys/${surveyId}/questions/order`, { method: "POST", body: { questionIds: ids } }); loadAll(); }
  catch (e) { showMsg("err", e.message); }
}

async function delQuestion(qid) {
  if (!confirm("删除后新填写者将不再看到该题（软删除，历史答卷与统计保留）。确定删除？")) return;
  try { await api(`/api/questions/${qid}`, { method: "DELETE" }); loadAll(); }
  catch (e) { showMsg("err", e.message); }
}

// ---------------- 题目编辑器 ----------------

function startAdd() {
  editingId = null;
  document.getElementById("editor-title").textContent = "添加题目";
  document.getElementById("q-type").disabled = false;
  document.getElementById("q-type").value = "single_choice";
  document.getElementById("q-title").value = "";
  document.getElementById("q-required").checked = false;
  optRows = [{ key: "opt_1", text: "" }, { key: "opt_2", text: "" }];
  keySeq = 3;
  jumpRows = [];
  renderEditor();
  document.getElementById("qeditor").style.display = "block";
  document.getElementById("qeditor").scrollIntoView({ behavior: "smooth" });
}

function startEdit(qid) {
  const q = questions.find(x => x.id === qid);
  editingId = qid;
  document.getElementById("editor-title").textContent = "编辑题目";
  document.getElementById("q-type").disabled = true;
  document.getElementById("q-type").value = q.type;
  document.getElementById("q-title").value = q.title;
  document.getElementById("q-required").checked = !!q.required;
  optRows = (q.options || []).map(o => ({ key: o.key, text: o.text }));
  keySeq = optRows.length + 1;
  jumpRows = JSON.parse(JSON.stringify(q.jumpRules || []));
  renderEditor();
  document.getElementById("qeditor").style.display = "block";
  document.getElementById("qeditor").scrollIntoView({ behavior: "smooth" });
}

function cancelEdit() { document.getElementById("qeditor").style.display = "none"; }

function currentType() { return document.getElementById("q-type").value; }

function renderEditor() {
  const t = currentType();
  document.getElementById("q-options-box").style.display = (t === "single_choice" || t === "multi_choice") ? "block" : "none";
  document.getElementById("q-config-box").innerHTML = CONFIG_HTML[t] || "";
  // 回填 config 值
  if (editingId) {
    const q = questions.find(x => x.id === editingId);
    const c = q.config || {};
    for (const [k, v] of Object.entries(c)) {
      const el = document.getElementById("c-" + k);
      if (!el) continue;
      if (el.type === "checkbox") el.checked = !!v;
      else if (v != null) el.value = v;
    }
  }
  renderOptRows(); renderJumpRows();
}

function renderOptRows() {
  const box = document.getElementById("q-options");
  box.innerHTML = "";
  optRows.forEach((r, i) => {
    const div = document.createElement("div");
    div.className = "opt-row";
    div.innerHTML = `<input type="text" value="${esc(r.text)}" placeholder="选项 ${i + 1} 文本" oninput="optRows[${i}].text=this.value">
      <button class="small danger ghost" onclick="optRows.splice(${i},1);renderOptRows();renderJumpRows()">✕</button>`;
    box.appendChild(div);
  });
}

function addOptRow() {
  optRows.push({ key: "opt_" + keySeq++, text: "" });
  renderOptRows(); renderJumpRows();
}

function renderJumpRows() {
  const box = document.getElementById("q-jumps");
  box.innerHTML = "";
  if (!jumpRows.length) {
    box.innerHTML = '<div class="muted" style="margin-bottom:6px;">未配置跳转：按题目顺序作答。</div>';
    return;
  }
  const t = currentType();
  jumpRows.forEach((j, i) => renderJumpRow(box, i, j, t));
}

function kindOptions(t) {
  const opts = [];
  if (t === "single_choice" || t === "multi_choice") {
    opts.push(["option_any", "选中任一选项"], ["option_all", "同时选中全部选项"]);
  }
  if (t === "number") opts.push(["number", "数字满足条件"]);
  opts.push(["always", "无条件"]);
  return opts;
}

function renderJumpRow(box, i, j, t) {
  const div = document.createElement("div");
  div.className = "jump-row";
  const kinds = kindOptions(t).map(([v, label]) =>
    `<option value="${v}" ${(j.match.kind === v) ? "selected" : ""}>${label}</option>`).join("");
  const others = questions.filter(q => q.id !== editingId);
  const targets = others.map(q =>
    `<option value="${q.id}" ${j.goto === q.id ? "selected" : ""}>第${q.order}题 · ${esc(q.title)}</option>`).join("");
  div.innerHTML = `
    <select onchange="jumpRows[${i}].match={kind:this.value};renderJumpRows()">${kinds}</select>
    <span>→ 跳转到</span>
    <select onchange="jumpRows[${i}].goto=this.value">
      <option value="end" ${j.goto === "end" ? "selected" : ""}>结束问卷</option>
      ${targets}
    </select>
    <button class="small danger ghost" style="margin-left:auto" onclick="jumpRows.splice(${i},1);renderJumpRows()">删除</button>
    <div class="jump-params" id="jp-${i}"></div>`;
  box.appendChild(div);
  renderJumpParams(i, j);
}

function renderJumpParams(i, j) {
  const el = document.getElementById("jp-" + i);
  const kind = j.match.kind;
  const m = j.match;
  if (kind === "option_any" || kind === "option_all") {
    const opts = optRows.filter(r => r.text.trim());
    if (!opts.length) { el.innerHTML = '<span style="color:var(--danger)">请先填写选项</span>'; return; }
    el.innerHTML = "选项：" + opts.map(r =>
      `<label style="display:inline-flex;align-items:center;gap:3px;">
        <input type="checkbox" ${((m.optionKeys || []).includes(r.key)) ? "checked" : ""}
          onchange="toggleJumpKey(${i},'${esc(r.key)}',this.checked)"> ${esc(r.text)}
      </label>`).join(" &nbsp;");
  } else if (kind === "number") {
    const ops = [["eq", "="], ["ne", "≠"], ["gt", ">"], ["gte", "≥"], ["lt", "<"], ["lte", "≤"], ["between", "介于"]]
      .map(([v, l]) => `<option value="${v}" ${m.op === v ? "selected" : ""}>${l}</option>`).join("");
    el.innerHTML = `<select onchange="setJumpOp(${i},this.value)">${ops}</select>` +
      (m.op === "between"
        ? `<input type="number" step="any" placeholder="最小" style="width:90px" value="${m.min ?? ""}" oninput="jumpRows[${i}].match.min=this.value===''?null:Number(this.value)">
           <span>~</span>
           <input type="number" step="any" placeholder="最大" style="width:90px" value="${m.max ?? ""}" oninput="jumpRows[${i}].match.max=this.value===''?null:Number(this.value)">`
        : `<input type="number" step="any" placeholder="阈值" style="width:110px" value="${m.value ?? ""}" oninput="jumpRows[${i}].match.value=this.value===''?null:Number(this.value)">`);
  } else {
    el.innerHTML = "";
  }
}

function toggleJumpKey(i, key, on) {
  const m = jumpRows[i].match;
  m.optionKeys = m.optionKeys || [];
  if (on && !m.optionKeys.includes(key)) m.optionKeys.push(key);
  if (!on) m.optionKeys = m.optionKeys.filter(k => k !== key);
}

function setJumpOp(i, op) { jumpRows[i].match.op = op; renderJumpRows(); }

function addJumpRow() {
  const t = currentType();
  const kind = kindOptions(t)[0][0];
  const m = { kind };
  if (kind === "number") { m.op = "gte"; m.value = 18; }
  jumpRows.push({ match: m, goto: "end" });
  renderJumpRows();
}

function collectPayload() {
  const t = currentType();
  const payload = {
    type: t,
    title: document.getElementById("q-title").value,
    required: document.getElementById("q-required").checked,
  };
  if (t === "single_choice" || t === "multi_choice") {
    payload.options = optRows.filter(r => r.text.trim()).map(r => ({ key: r.key, text: r.text.trim() }));
  }
  const num = id => { const v = document.getElementById(id)?.value; return v === "" || v == null ? null : Number(v); };
  const cfg = {};
  if (t === "multi_choice") { cfg.minSelect = num("c-minSelect"); cfg.maxSelect = num("c-maxSelect"); }
  if (t === "text") { cfg.minLength = num("c-minLength"); cfg.maxLength = num("c-maxLength"); }
  if (t === "number") { cfg.min = num("c-min"); cfg.max = num("c-max"); cfg.integer = document.getElementById("c-integer").checked; }
  payload.config = cfg;
  payload.jumpRules = jumpRows;
  return payload;
}

async function saveQuestion() {
  try {
    const body = collectPayload();
    if (editingId) await api(`/api/questions/${editingId}`, { method: "PATCH", body });
    else await api(`/api/surveys/${surveyId}/questions`, { method: "POST", body });
    cancelEdit(); loadAll();
  } catch (e) { showMsg("err", e.message); document.getElementById("qeditor").scrollIntoView(); }
}

// ---------------- 题库选题（第二阶段） ----------------

async function toggleBankPicker() {
  const box = document.getElementById("bank-picker");
  const show = box.style.display === "none";
  box.style.display = show ? "block" : "none";
  if (show) await loadBankList();
}

async function loadBankList() {
  const tb = document.getElementById("bank-tbody");
  tb.innerHTML = '<tr><td colspan="5" class="muted">加载中…</td></tr>';
  try {
    const [mine, shared] = await Promise.all([
      api("/api/bank/questions?scope=mine"),
      api("/api/bank/questions?scope=shared"),
    ]);
    const rows = [
      ...mine.questions.map(q => ({ ...q, from: "我的题库" })),
      ...shared.questions.map(q => ({ ...q, from: `共享自 ${q.ownerName}` })),
    ];
    if (!rows.length) {
      tb.innerHTML = '<tr><td colspan="5" class="muted">题库为空：先在问卷里创建题目（自动入库），或到「题库」页新建。</td></tr>';
      return;
    }
    tb.innerHTML = "";
    for (const q of rows) {
      const inUse = questions.some(x => x.rootId === q.id);
      const verOptions = Array.from({length: q.currentVersion}, (_, i) => i + 1)
        .map(v => `<option value="${v}" ${v === q.currentVersion ? "selected" : ""}>v${v}</option>`).join("");
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${esc(q.title)}</td>
        <td>${TYPE_LABELS[q.type] || q.type}${q.required ? " · 必答" : ""}</td>
        <td>共 ${q.currentVersion} 版（最新 v${q.currentVersion}）</td>
        <td class="muted">${esc(q.from)}</td>
        <td>${inUse
          ? '<span class="muted">已在问卷中</span>'
          : `<select id="pick-${q.id}" style="padding:2px 4px;border:1px solid var(--border);border-radius:4px;">${verOptions}</select>
             <button class="small" onclick="addFromBank('${q.id}')">加入本问卷</button>`}</td>`;
      tb.appendChild(tr);
    }
  } catch (e) { showMsg("err", e.message); }
}

async function addFromBank(rootId) {
  const version = Number(document.getElementById("pick-" + rootId)?.value) || undefined;
  try {
    await api(`/api/surveys/${surveyId}/questions/from-bank`,
      { method: "POST", body: { rootId, version } });
    showMsg("err", "已从题库加入题目（追加到末尾，可上移调整顺序）。", true);
    await loadAll();
    await loadBankList();  // 刷新"已在问卷中"状态，避免重复加入报 409
  } catch (e) { showMsg("err", e.message); }
}

async function saveBankQ(qid, title) {
  if (!confirm(`把「${title}」存入题库？\n\n存入后可在其他问卷复用、共享给他人，并支持版本管理与跨问卷统计。`)) return;
  try {
    const r = await api(`/api/surveys/${surveyId}/questions/${qid}/save-to-bank`, { method: "POST" });
    showMsg("err", `已存入题库（v${r.savedVersion}）。`, true);
    loadAll();
  } catch (e) { showMsg("err", e.message); }
}

async function upgradeQ(qid, title) {
  const version = Number(document.getElementById("ver-" + qid)?.value);
  if (!version) return;
  if (!confirm(`把「${title}」切换到题库 v${version}？\n\n本问卷已有答卷时将自动生成分叉，历史答卷与统计不受影响。`)) return;
  try {
    const r = await api(`/api/surveys/${surveyId}/questions/${qid}/upgrade`,
      { method: "POST", body: { version } });
    showMsg("err", `已切换到 v${r.upgradedTo}。`, true);
    loadAll();
  } catch (e) { showMsg("err", e.message); }
}

document.getElementById("q-type").addEventListener("change", renderEditor);
loadAll();
</script>
